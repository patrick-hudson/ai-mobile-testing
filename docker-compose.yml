x-audit-base: &audit-base
  build:
    context: .
    args:
      PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.1}
      INSTALL_MSEDGE: ${INSTALL_MSEDGE:-0}
  image: quitting7oh-release-audit:${AUDIT_IMAGE_TAG:-local}
  init: true
  shm_size: 1gb
  volumes:
    - ./artifacts:/work/artifacts
    - ./certs:/work/certs:ro
  environment:
    PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
    CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
    AUDIT_WORKERS: ${AUDIT_WORKERS:-3}
    AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
    AUDIT_TARGET_IDS: ${AUDIT_TARGET_IDS:-}
    CANDIDATE_IGNORE_HTTPS_ERRORS: ${CANDIDATE_IGNORE_HTTPS_ERRORS:-0}

services:
  single-site-volume-init:
    <<: *audit-base
    command: ["bash", "docker/init-single-site-volumes.sh"]
    healthcheck:
      disable: true
    restart: "no"
    volumes:
      - single-site-jobs:/var/lib/ai-mobile-testing/jobs
      - shared-parent-runs:/var/lib/ai-mobile-testing/shared/canonical
      - shared-store-trust:/var/lib/ai-mobile-testing/shared/trust
      - shared-worker-exchange:/var/lib/ai-mobile-testing/shared/exchange
      - shared-control-identities:/var/lib/ai-mobile-testing/shared/credentials
      - shared-worker-ordinary-a-secret:/var/lib/ai-mobile-testing/shared/secrets/ordinary-a
      - shared-worker-ordinary-b-secret:/var/lib/ai-mobile-testing/shared/secrets/ordinary-b
      - shared-worker-performance-secret:/var/lib/ai-mobile-testing/shared/secrets/performance

  portal:
    <<: *audit-base
    depends_on:
      single-site-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PORTAL_PORT:-4173}:4173"
    environment:
      PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
      CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
      AUDIT_WORKERS: ${AUDIT_WORKERS:-3}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_TARGET_IDS: ${AUDIT_TARGET_IDS:-}
      CANDIDATE_IGNORE_HTTPS_ERRORS: ${CANDIDATE_IGNORE_HTTPS_ERRORS:-0}
      PORTAL_MAX_CONCURRENT_RUNS: ${PORTAL_MAX_CONCURRENT_RUNS:-1}
      PORTAL_SHARDED_ARTIFACT_ROOT: ${PORTAL_SHARDED_ARTIFACT_ROOT:-/work/artifacts/sharded}
      PORTAL_EXTERNAL_RUN_SYNC_MS: ${PORTAL_EXTERNAL_RUN_SYNC_MS:-1000}
      PORTAL_LOOPBACK_PUBLISHED: "1"
      PORTAL_SHARED_CONTROL: ${PORTAL_SHARED_CONTROL:-0}
      PORTAL_PUBLISHED_ORIGIN: ${PORTAL_PUBLISHED_ORIGIN:-http://127.0.0.1:4173}
      PORTAL_ACCEPTED_SOCKET_HOST: ${PORTAL_ACCEPTED_SOCKET_HOST:-127.0.0.1}
      PORTAL_SESSION_SECURE: ${PORTAL_SESSION_SECURE:-0}
      PORTAL_SECRET_ROOT: /var/lib/ai-mobile-testing/secrets
      PORTAL_SINGLE_SITE_QUEUE_ROOT: /var/lib/ai-mobile-testing/jobs
      PORTAL_SINGLE_SITE_FINALIZATION_ROOT: /var/lib/ai-mobile-testing/finalizations
      PORTAL_VISUAL_BASELINE_ROOT: /var/lib/ai-mobile-testing/baselines
      PORTAL_SHARED_CREDENTIAL_ROOT: /var/lib/ai-mobile-testing/shared/credentials
      AUDIT_SHARED_STORE_ROOT: /var/lib/ai-mobile-testing/shared/canonical
      AUDIT_SHARED_ADMISSION_ROOT: /var/lib/ai-mobile-testing/shared/canonical/cutover-admission
      AUDIT_LEGACY_AUTHORITY_FENCE_ROOT: /var/lib/ai-mobile-testing/shared/canonical/legacy-authority
      AUDIT_SHARED_STORE_MARKER_FILE: /var/lib/ai-mobile-testing/shared/trust/store-marker
      AUDIT_SHARED_BACKUP_MARKER_FILE: /var/lib/ai-mobile-testing/shared/trust/backup-marker
      AUDIT_SHARED_DEPLOYMENT_IDENTITY: ${AUDIT_SHARED_DEPLOYMENT_IDENTITY:-compose:ai-mobile-testing}
      AUDIT_SHARED_VOLUME_IDENTITY: named-volume:shared-parent-runs
      AUDIT_SHARED_BUILD_IDENTITY: ${AUDIT_SHARED_BUILD_IDENTITY:-build:quitting7oh-release-audit-local}
      AUDIT_SHARED_PREQUALIFIED_ROLLBACK_BUILDS: ${AUDIT_SHARED_PREQUALIFIED_ROLLBACK_BUILDS:-build:quitting7oh-release-audit-local}
      AUDIT_SHARED_STORE_GENERATION: ${AUDIT_SHARED_STORE_GENERATION:-1}
      AUDIT_SHARED_PROJECT_ID: ${AUDIT_SHARED_PROJECT_ID:-default}
      AUDIT_PREVIEW_TLS_BYPASS_ALLOWLIST: ${AUDIT_PREVIEW_TLS_BYPASS_ALLOWLIST:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      AI_REVIEW_DRY_RUN: ${AI_REVIEW_DRY_RUN:-}
    stop_grace_period: 15s
    volumes:
      - ./artifacts:/work/artifacts
      - ./certs:/work/certs:ro
      - portal-secrets:/var/lib/ai-mobile-testing/secrets
      - single-site-jobs:/var/lib/ai-mobile-testing/jobs
      - single-site-finalizations:/var/lib/ai-mobile-testing/finalizations
      - single-site-baselines:/var/lib/ai-mobile-testing/baselines
      - shared-parent-runs:/var/lib/ai-mobile-testing/shared/canonical
      - shared-store-trust:/var/lib/ai-mobile-testing/shared/trust:ro
      - shared-control-identities:/var/lib/ai-mobile-testing/shared/credentials

  single-site-worker:
    <<: *audit-base
    user: pwuser
    healthcheck:
      disable: true
    command: ["npm", "run", "single-site:worker-pool:container"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      single-site-volume-init:
        condition: service_completed_successfully
    environment:
      AUDIT_JOB_QUEUE_ROOT: /var/lib/ai-mobile-testing/jobs
      AUDIT_QUEUE_POLL_MS: ${AUDIT_QUEUE_POLL_MS:-1000}
      AUDIT_WORKERS: ${AUDIT_WORKERS:-3}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_PREVIEW_TLS_BYPASS_ALLOWLIST: ${AUDIT_PREVIEW_TLS_BYPASS_ALLOWLIST:-}
      AUDIT_MSEDGE_AVAILABLE: ${INSTALL_MSEDGE:-0}
    volumes:
      - ./certs:/work/certs:ro
      - single-site-jobs:/var/lib/ai-mobile-testing/jobs

  single-site-finalizer:
    <<: *audit-base
    healthcheck:
      disable: true
    command: ["npm", "run", "single-site:finalizer-pool:container"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      single-site-volume-init:
        condition: service_completed_successfully
    environment:
      AUDIT_JOB_QUEUE_ROOT: /var/lib/ai-mobile-testing/jobs
      AUDIT_FINALIZATION_OUTPUT_ROOT: /var/lib/ai-mobile-testing/finalizations
      AUDIT_VISUAL_BASELINE_ROOT: /var/lib/ai-mobile-testing/baselines
      AUDIT_QUEUE_POLL_MS: ${AUDIT_QUEUE_POLL_MS:-1000}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_LEGACY_AUTHORITY_FENCE_ROOT: /var/lib/ai-mobile-testing/shared/canonical/legacy-authority
    volumes:
      - single-site-jobs:/var/lib/ai-mobile-testing/jobs
      - single-site-finalizations:/var/lib/ai-mobile-testing/finalizations
      - single-site-baselines:/var/lib/ai-mobile-testing/baselines
      - shared-parent-runs:/var/lib/ai-mobile-testing/shared/canonical

  shared-coordinator:
    <<: *audit-base
    profiles: [shared-runner]
    user: pwuser
    healthcheck:
      disable: true
    command: ["node", "scripts/run-shared-coordinator.mjs"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      single-site-volume-init:
        condition: service_completed_successfully
      shared-identity-provisioner:
        condition: service_completed_successfully
    environment:
      AUDIT_SHARED_STORE_ROOT: /var/lib/ai-mobile-testing/shared/canonical
      AUDIT_SHARED_STORE_MARKER_FILE: /var/lib/ai-mobile-testing/shared/trust/store-marker
      AUDIT_SHARED_BACKUP_MARKER_FILE: /var/lib/ai-mobile-testing/shared/trust/backup-marker
      AUDIT_SHARED_EXCHANGE_ROOT: /var/lib/ai-mobile-testing/shared/exchange
      AUDIT_SHARED_DEPLOYMENT_IDENTITY: ${AUDIT_SHARED_DEPLOYMENT_IDENTITY:-compose:ai-mobile-testing}
      AUDIT_SHARED_VOLUME_IDENTITY: ${AUDIT_SHARED_VOLUME_IDENTITY:-named-volume:shared-parent-runs}
      AUDIT_SHARED_BUILD_IDENTITY: ${AUDIT_SHARED_BUILD_IDENTITY:-build:quitting7oh-release-audit-local}
      AUDIT_SHARED_PREQUALIFIED_ROLLBACK_BUILDS: ${AUDIT_SHARED_PREQUALIFIED_ROLLBACK_BUILDS:-build:quitting7oh-release-audit-local}
      AUDIT_SHARED_STORE_GENERATION: ${AUDIT_SHARED_STORE_GENERATION:-1}
      AUDIT_SHARED_COORDINATOR_PORT: "4180"
      AUDIT_SHARED_LEASE_MS: ${AUDIT_SHARED_LEASE_MS:-30000}
      AUDIT_SHARED_COORDINATOR_LEASE_MS: ${AUDIT_SHARED_COORDINATOR_LEASE_MS:-60000}
      AUDIT_SHARED_UPLOAD_TIMEOUT_MS: ${AUDIT_SHARED_UPLOAD_TIMEOUT_MS:-1200000}
      AUDIT_SHARED_CREDENTIAL_ROOT: /var/lib/ai-mobile-testing/shared/credentials
      AUDIT_SHARED_PROJECT_ID: ${AUDIT_SHARED_PROJECT_ID:-default}
    volumes:
      - shared-parent-runs:/var/lib/ai-mobile-testing/shared/canonical
      - shared-store-trust:/var/lib/ai-mobile-testing/shared/trust:ro
      - shared-worker-exchange:/var/lib/ai-mobile-testing/shared/exchange
      - shared-control-identities:/var/lib/ai-mobile-testing/shared/credentials

  shared-identity-provisioner:
    <<: *audit-base
    profiles: [shared-runner]
    user: pwuser
    healthcheck:
      disable: true
    command: ["node", "scripts/provision-shared-worker-identities.mjs"]
    restart: "no"
    depends_on:
      single-site-volume-init:
        condition: service_completed_successfully
    environment:
      AUDIT_SHARED_CREDENTIAL_ROOT: /var/lib/ai-mobile-testing/shared/credentials
      AUDIT_SHARED_PROJECT_ID: ${AUDIT_SHARED_PROJECT_ID:-default}
      AUDIT_SHARED_ORDINARY_CAPABILITIES: ${AUDIT_SHARED_ORDINARY_CAPABILITIES:-inventory:http,browser:chromium,browser:firefox,browser:webkit}
      AUDIT_SHARED_WORKER_A_CREDENTIAL_FILE: /var/lib/ai-mobile-testing/shared/secrets/ordinary-a/token
      AUDIT_SHARED_WORKER_B_CREDENTIAL_FILE: /var/lib/ai-mobile-testing/shared/secrets/ordinary-b/token
      AUDIT_SHARED_PERFORMANCE_CREDENTIAL_FILE: /var/lib/ai-mobile-testing/shared/secrets/performance/token
    volumes:
      - shared-control-identities:/var/lib/ai-mobile-testing/shared/credentials
      - shared-worker-ordinary-a-secret:/var/lib/ai-mobile-testing/shared/secrets/ordinary-a
      - shared-worker-ordinary-b-secret:/var/lib/ai-mobile-testing/shared/secrets/ordinary-b
      - shared-worker-performance-secret:/var/lib/ai-mobile-testing/shared/secrets/performance

  shared-resilience-driver:
    <<: *audit-base
    profiles: [shared-proof]
    user: pwuser
    healthcheck:
      disable: true
    command: ["node", "scripts/shared-docker-resilience-fixture.mjs"]
    restart: "no"
    environment:
      AUDIT_SHARED_STORE_ROOT: /var/lib/ai-mobile-testing/shared/canonical
      AUDIT_SHARED_STORE_MARKER_FILE: /var/lib/ai-mobile-testing/shared/trust/store-marker
      AUDIT_SHARED_BACKUP_MARKER_FILE: /var/lib/ai-mobile-testing/shared/trust/backup-marker
      AUDIT_SHARED_DEPLOYMENT_IDENTITY: ${AUDIT_SHARED_DEPLOYMENT_IDENTITY:-compose:ai-mobile-testing}
      AUDIT_SHARED_VOLUME_IDENTITY: ${AUDIT_SHARED_VOLUME_IDENTITY:-named-volume:shared-parent-runs}
      AUDIT_SHARED_BUILD_IDENTITY: ${AUDIT_SHARED_BUILD_IDENTITY:-build:quitting7oh-release-audit-local}
      AUDIT_SHARED_PREQUALIFIED_ROLLBACK_BUILDS: ${AUDIT_SHARED_PREQUALIFIED_ROLLBACK_BUILDS:-build:quitting7oh-release-audit-local}
      AUDIT_SHARED_STORE_GENERATION: ${AUDIT_SHARED_STORE_GENERATION:-1}
    volumes:
      - shared-parent-runs:/var/lib/ai-mobile-testing/shared/canonical
      - shared-store-trust:/var/lib/ai-mobile-testing/shared/trust:ro

  shadow-validation:
    build:
      context: .
      target: audit-source
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.1}
        INSTALL_MSEDGE: "0"
    image: quitting7oh-shadow-validation:${AUDIT_IMAGE_TAG:-local}
    profiles: [shadow-validation]
    init: true
    user: "${AUDIT_HOST_UID:-1000}:${AUDIT_HOST_GID:-1000}"
    healthcheck:
      disable: true
    command: ["npm", "run", "shadow-validation:container"]
    restart: "no"
    read_only: true
    network_mode: "none"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./artifacts/shadow-validation:/work/artifacts/shadow-validation

  shared-worker-ordinary-a:
    <<: *audit-base
    profiles: [shared-runner]
    user: pwuser
    healthcheck:
      disable: true
    command: ["node", "scripts/run-shared-worker.mjs"]
    restart: unless-stopped
    stop_grace_period: 90s
    cpus: "${AUDIT_SHARED_ORDINARY_CPUS:-1.0}"
    mem_limit: ${AUDIT_SHARED_ORDINARY_MEMORY:-2g}
    depends_on:
      shared-coordinator:
        condition: service_started
      shared-identity-provisioner:
        condition: service_completed_successfully
    environment:
      AUDIT_SHARED_COORDINATOR_URL: http://shared-coordinator:4180
      AUDIT_SHARED_WORKER_CAPABILITIES: ${AUDIT_SHARED_ORDINARY_CAPABILITIES:-inventory:http,browser:chromium,browser:firefox,browser:webkit}
      AUDIT_SHARED_RESOURCE_CLASS: ordinary
      AUDIT_SHARED_POLL_MS: ${AUDIT_SHARED_POLL_MS:-1000}
      AUDIT_SHARED_RESILIENCE_PROOF: ${AUDIT_SHARED_RESILIENCE_PROOF:-0}
      AUDIT_SHARED_UPLOAD_TIMEOUT_MS: ${AUDIT_SHARED_UPLOAD_TIMEOUT_MS:-1200000}
      AUDIT_SHARED_WORKER_TOKEN_FILE: /run/secrets/shared-worker/token
    volumes:
      - ./certs:/work/certs:ro
      - shared-worker-ordinary-a-secret:/run/secrets/shared-worker:ro

  shared-worker-ordinary-b:
    <<: *audit-base
    profiles: [shared-runner]
    user: pwuser
    healthcheck:
      disable: true
    command: ["node", "scripts/run-shared-worker.mjs"]
    restart: unless-stopped
    stop_grace_period: 90s
    cpus: "${AUDIT_SHARED_ORDINARY_CPUS:-1.0}"
    mem_limit: ${AUDIT_SHARED_ORDINARY_MEMORY:-2g}
    depends_on:
      shared-coordinator:
        condition: service_started
      shared-identity-provisioner:
        condition: service_completed_successfully
    environment:
      AUDIT_SHARED_COORDINATOR_URL: http://shared-coordinator:4180
      AUDIT_SHARED_WORKER_CAPABILITIES: ${AUDIT_SHARED_ORDINARY_CAPABILITIES:-inventory:http,browser:chromium,browser:firefox,browser:webkit}
      AUDIT_SHARED_RESOURCE_CLASS: ordinary
      AUDIT_SHARED_POLL_MS: ${AUDIT_SHARED_POLL_MS:-1000}
      AUDIT_SHARED_RESILIENCE_PROOF: ${AUDIT_SHARED_RESILIENCE_PROOF:-0}
      AUDIT_SHARED_UPLOAD_TIMEOUT_MS: ${AUDIT_SHARED_UPLOAD_TIMEOUT_MS:-1200000}
      AUDIT_SHARED_WORKER_TOKEN_FILE: /run/secrets/shared-worker/token
    volumes:
      - ./certs:/work/certs:ro
      - shared-worker-ordinary-b-secret:/run/secrets/shared-worker:ro

  shared-worker-performance:
    <<: *audit-base
    profiles: [shared-runner]
    user: pwuser
    healthcheck:
      disable: true
    command: ["node", "scripts/run-shared-worker.mjs"]
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "2.0"
    mem_limit: 4g
    depends_on:
      shared-coordinator:
        condition: service_started
      shared-identity-provisioner:
        condition: service_completed_successfully
    environment:
      AUDIT_SHARED_COORDINATOR_URL: http://shared-coordinator:4180
      AUDIT_SHARED_WORKER_CAPABILITIES: performance:lighthouse
      AUDIT_SHARED_RESOURCE_CLASS: performance
      AUDIT_SHARED_UPLOAD_TIMEOUT_MS: ${AUDIT_SHARED_UPLOAD_TIMEOUT_MS:-1200000}
      AUDIT_SHARED_WORKER_TOKEN_FILE: /run/secrets/shared-worker/token
    volumes:
      - ./certs:/work/certs:ro
      - shared-worker-performance-secret:/run/secrets/shared-worker:ro

  single-site-lease-load-proof:
    <<: *audit-base
    build:
      context: .
      target: lease-load-proof
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.1}
        INSTALL_MSEDGE: ${INSTALL_MSEDGE:-0}
    image: quitting7oh-release-audit-lease-load-proof:${AUDIT_IMAGE_TAG:-local}
    profiles: [lease-proof]
    user: pwuser
    healthcheck:
      disable: true
    command: ["npm", "run", "single-site-lease-load:container"]
    restart: "no"
    cpus: "2.0"
    mem_limit: 4g
    environment:
      AUDIT_JOB_QUEUE_ROOT: /work/artifacts/self-tests/lease-load-queue
    volumes:
      - ./artifacts:/work/artifacts

  portal-e2e:
    <<: *audit-base
    profiles: [portal-test]
    healthcheck:
      disable: true
    cpus: "2.0"
    mem_limit: 4g
    command: ["npm", "run", "portal:e2e:container"]
    environment:
      PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
      CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
      AUDIT_WORKERS: ${PORTAL_E2E_WORKERS:-1}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_TARGET_IDS: ""
      CANDIDATE_IGNORE_HTTPS_ERRORS: "0"
      PORTAL_E2E_OUTPUT_DIR: /work/artifacts/portal-e2e
      PORTAL_E2E_CANONICAL_PROFILE: "1"
      PORTAL_E2E_GREP: ${PORTAL_E2E_GREP:-}
      PORTAL_E2E_UPDATE_SNAPSHOTS: ${PORTAL_E2E_UPDATE_SNAPSHOTS:-0}
      PORTAL_E2E_CANONICAL_SCALE: ${PORTAL_E2E_CANONICAL_SCALE:-0}
      PORTAL_E2E_RESTORE_ARTIFACT_OWNER: "1"

  audit-smoke:
    <<: *audit-base
    profiles: [audit]
    healthcheck:
      disable: true
    command: ["npm", "run", "audit:smoke:container"]
    environment:
      PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
      CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
      AUDIT_WORKERS: ${AUDIT_WORKERS:-3}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_TARGET_IDS: ${AUDIT_TARGET_IDS:-}
      CANDIDATE_IGNORE_HTTPS_ERRORS: ${CANDIDATE_IGNORE_HTTPS_ERRORS:-0}
      AUDIT_ARTIFACT_DIR: ${AUDIT_ARTIFACT_DIR:-/work/artifacts/docker-smoke}

  audit-release:
    <<: *audit-base
    profiles: [audit]
    healthcheck:
      disable: true
    command: ["npm", "run", "audit:release:container"]
    environment:
      PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
      CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
      AUDIT_WORKERS: ${AUDIT_WORKERS:-3}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_TARGET_IDS: ${AUDIT_TARGET_IDS:-}
      CANDIDATE_IGNORE_HTTPS_ERRORS: ${CANDIDATE_IGNORE_HTTPS_ERRORS:-0}
      AUDIT_ARTIFACT_DIR: ${AUDIT_ARTIFACT_DIR:-/work/artifacts/docker-release}
      AUDIT_LEGACY_AUTHORITY_FENCE_ROOT: /var/lib/ai-mobile-testing/shared/canonical/legacy-authority
    volumes:
      - ./artifacts:/work/artifacts
      - ./certs:/work/certs:ro
      - shared-parent-runs:/var/lib/ai-mobile-testing/shared/canonical

  audit-release-shard:
    <<: *audit-base
    profiles: [audit-sharded]
    healthcheck:
      disable: true
    command: ["npm", "run", "audit:release:shard:container"]
    environment:
      PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
      CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
      AUDIT_WORKERS: ${AUDIT_SHARD_WORKERS:-1}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_TARGET_IDS: ${AUDIT_TARGET_IDS:-}
      CANDIDATE_IGNORE_HTTPS_ERRORS: ${CANDIDATE_IGNORE_HTTPS_ERRORS:-0}
      AUDIT_PROFILE: release
      AUDIT_EXCLUDE_PERFORMANCE: "1"
      AUDIT_SHARDED_RUN_ID: ${AUDIT_SHARDED_RUN_ID:-manual-sharded-release}
      AUDIT_SHARD_INDEX: ${AUDIT_SHARD_INDEX:-1}
      AUDIT_SHARD_TOTAL: ${AUDIT_SHARD_TOTAL:-8}
      AUDIT_ARTIFACT_DIR: /work/artifacts/sharded/${AUDIT_SHARDED_RUN_ID:-manual-sharded-release}/shards/shard-${AUDIT_SHARD_INDEX:-1}-of-${AUDIT_SHARD_TOTAL:-8}
      PLAYWRIGHT_BLOB_OUTPUT_FILE: /work/artifacts/sharded/${AUDIT_SHARDED_RUN_ID:-manual-sharded-release}/blob-reports/report-${AUDIT_SHARD_INDEX:-1}-of-${AUDIT_SHARD_TOTAL:-8}.zip

  audit-release-performance:
    <<: *audit-base
    profiles: [audit-sharded]
    healthcheck:
      disable: true
    command: ["npm", "run", "audit:release:performance:container"]
    environment:
      PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
      CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
      AUDIT_WORKERS: "1"
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_TARGET_IDS: ${AUDIT_TARGET_IDS:-}
      CANDIDATE_IGNORE_HTTPS_ERRORS: ${CANDIDATE_IGNORE_HTTPS_ERRORS:-0}
      AUDIT_PROFILE: release
      AUDIT_EXCLUDE_PERFORMANCE: "0"
      AUDIT_SHARDED_RUN_ID: ${AUDIT_SHARDED_RUN_ID:-manual-sharded-release}
      AUDIT_ARTIFACT_DIR: /work/artifacts/sharded/${AUDIT_SHARDED_RUN_ID:-manual-sharded-release}/shards/performance-isolated
      PLAYWRIGHT_BLOB_OUTPUT_FILE: /work/artifacts/sharded/${AUDIT_SHARDED_RUN_ID:-manual-sharded-release}/blob-reports/performance-isolated.zip

  audit-release-merge:
    <<: *audit-base
    healthcheck:
      disable: true
    profiles: [audit-sharded]
    command: ["npm", "run", "audit:release:merge:container"]
    environment:
      PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
      CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_TARGET_IDS: ${AUDIT_TARGET_IDS:-}
      CANDIDATE_IGNORE_HTTPS_ERRORS: ${CANDIDATE_IGNORE_HTTPS_ERRORS:-0}
      AUDIT_PROFILE: release
      AUDIT_SHARDED_RUN_ID: ${AUDIT_SHARDED_RUN_ID:-manual-sharded-release}
      AUDIT_SHARD_TOTAL: ${AUDIT_SHARD_TOTAL:-8}
      AUDIT_ARTIFACT_DIR: /work/artifacts/sharded/${AUDIT_SHARDED_RUN_ID:-manual-sharded-release}
      AUDIT_LEGACY_AUTHORITY_FENCE_ROOT: /var/lib/ai-mobile-testing/shared/canonical/legacy-authority
    volumes:
      - ./artifacts:/work/artifacts
      - ./certs:/work/certs:ro
      - shared-parent-runs:/var/lib/ai-mobile-testing/shared/canonical

  audit-update-visuals:
    <<: *audit-base
    profiles: [audit]
    healthcheck:
      disable: true
    command: ["npm", "run", "audit:update-visuals:container"]
    volumes:
      - ./artifacts:/work/artifacts
      - ./certs:/work/certs:ro
      - ./tests/__screenshots__:/work/tests/__screenshots__
    environment:
      PRODUCTION_URL: ${PRODUCTION_URL:-https://quitting7oh.org}
      CANDIDATE_URL: ${CANDIDATE_URL:-https://beta.quitting7oh-org.pages.dev}
      AUDIT_WORKERS: ${AUDIT_WORKERS:-2}
      AUDIT_VERBOSE: ${AUDIT_VERBOSE:-1}
      AUDIT_TARGET_IDS: ${AUDIT_TARGET_IDS:-}
      CANDIDATE_IGNORE_HTTPS_ERRORS: ${CANDIDATE_IGNORE_HTTPS_ERRORS:-0}
      AUDIT_ARTIFACT_DIR: ${AUDIT_ARTIFACT_DIR:-/work/artifacts/visual-baseline}

volumes:
  portal-secrets:
  single-site-jobs:
  single-site-finalizations:
  single-site-baselines:
  shared-parent-runs:
  shared-store-trust:
  shared-worker-exchange:
  shared-control-identities:
  shared-worker-ordinary-a-secret:
  shared-worker-ordinary-b-secret:
  shared-worker-performance-secret:
